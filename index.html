/* ============================================================

   Chaque personne a maintenant son propre fichier de config :

   {
     "nom": "Maxime",
     "type": "enfant",              // "parent" ou "enfant"

     "email": "adresse@exemple.com", // optionnel pour "enfant", requis pour "parent"

       "lundi": ["Faire son lit", "..."],

/* ============================================================
   IMAGES DES PERSONNES (stockées dans le dépôt)
   config/images/<dossier>/icon.png      -> photo ronde sur la carte
   config/images/<dossier>/banniere.png  -> fond d'écran quand la personne est au centre
   Le dossier porte l'identifiant de la personne (ex. "laurence"), sauf exceptions
   ci-dessous (ex. "valerie" -> dossier « valérie », avec accent).
   Si un fichier manque, on essaie d'autres extensions (jpg, jpeg, webp), puis
   l'image de secours de PERSONNE_META.
   ============================================================ */
const DOSSIER_IMAGES = "config/images";
const DOSSIERS_PERSONNES = { valerie: ["valérie", "valerie"] };
const EXTENSIONS_IMAGES = ["png", "jpg", "jpeg", "webp"];
const IMAGES_PERSONNES = {}; // id -> { icone, banniere } (URL déjà vérifiées)

function candidatsImage(id, noms){
  const dossiers = DOSSIERS_PERSONNES[id] || [id];
  const urls = [];
  dossiers.forEach(d => noms.forEach(nom => EXTENSIONS_IMAGES.forEach(ext => {
    urls.push(`${DOSSIER_IMAGES}/${encodeURIComponent(d)}/${nom}.${ext}`);
  })));
  return urls;
}

function sondeImage(url){
  return new Promise((resolve) => {
    const im = new Image();
    im.onload = () => resolve(true);
    im.onerror = () => resolve(false);
    im.src = url;
  });
}

async function premiereImageValide(urls){
  for(const u of urls){
    if(u && await sondeImage(u)) return u;
  }
  return null;
}

async function chargerImagesPersonnes(){
  await Promise.all(IDENTIFIANTS_PERSONNES.map(async (id) => {
    const meta = PERSONNE_META[id] || {};
    const [icone, banniere] = await Promise.all([
      premiereImageValide([...candidatsImage(id, ["icon"]), meta.avatar]),
      premiereImageValide([...candidatsImage(id, ["banniere", "banner"]), meta.banner])
    ]);
    IMAGES_PERSONNES[id] = { icone, banniere };
    if(vueActuelle === "login") majAvatarsAccueil(); // met à jour cartes + fond au fur et à mesure
  }));
}

let PERSONNES = {};
let CONFIG_MANQUANTE = []; // ids dont config/<id>.json n'a pas pu être lu
let TACHES = {};

function obtenirIdsPersonnes(){
  return Object.keys(PERSONNES);
}

async function chargerConfigPersonnes(){
  const resultats = await Promise.all(
    IDENTIFIANTS_PERSONNES.map(async (id) => {
      try{
        const reponse = await fetch(`config/${id}.json`, { cache: "no-store" });
        if(!reponse.ok) throw new Error(`Fichier introuvable : config/${id}.json`);
        const data = await reponse.json();
        return { id, data };
      }catch(e){
        console.error(`Erreur de chargement pour "${id}":`, e);
        return { id, data: null };
      }
    })
  );

  resultats.forEach(({ id, data }) => {
    if(!data){
      // Fichier illisible (ex. page ouverte en double-clic = file://, ou fichier absent).
      // On garde la carte pour que l'écran s'affiche, mais sans code PIN : connexion impossible.
      CONFIG_MANQUANTE.push(id);
      PERSONNES[id] = { nom: id.charAt(0).toUpperCase() + id.slice(1), type: "enfant", pin: null, email: null, horsConfig: true };
      TACHES[id] = {};
      return;
    }
    PERSONNES[id] = { nom: data.nom, type: data.type, pin: data.pin, email: data.email || null };
    TACHES[id] = data.taches || {};
  });
}

/* Surfaces « verre » (barre du haut, bouton, lignes de tâches) : claires par défaut,
   sombres pour les thèmes marqués  sombre: true  (ex. Nuit). */
const SURFACES_CLAIRES = {
  "--verre": "rgba(255,255,255,0.52)",
  "--verre-bouton": "rgba(255,255,255,0.7)",
  "--ligne": "rgba(255,255,255,0.78)",
  "--verre-panneau": "rgba(255,255,255,0.74)"
};
const SURFACES_SOMBRES = {
  "--verre": "rgba(36,40,50,0.78)",
  "--verre-bouton": "rgba(51,59,82,0.92)",
  "--ligne": "rgba(51,59,82,0.88)",
  "--verre-panneau": "rgba(30,34,44,0.84)"
};
/* Filtre posé sur l'image de fond quand un thème sombre est choisi (alpha : 0 = transparent, 1 = noir) */
const FILTRE_SOMBRE = "rgba(8,10,18,0.55)";
const FILTRE_AUCUN  = "rgba(8,10,18,0)";

/* Liquid glass : les boutons prennent la teinte de la couleur d'accent du thème.
   (calculé ici à partir de l'accent pour ne pas dépendre de color-mix) */
function hexVersRgbTheme(hex){
  const h = String(hex).replace('#', '');
  return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16));
}

function varsVerre(theme){
  const [r, g, b] = hexVersRgbTheme(theme.variables["--accent"]);
  const [dr, dg, db] = hexVersRgbTheme(theme.variables["--danger"] || "#F0645A");
  const sombre = !!theme.sombre;
  const a = (alpha) => `rgba(${r},${g},${b},${alpha})`;
  const d = (alpha) => `rgba(${dr},${dg},${db},${alpha})`;
  const fonce = (k) => `rgb(${Math.round(r*k)},${Math.round(g*k)},${Math.round(b*k)})`;
  return {
    "--verre-sombre-a": `rgba(${Math.round(r*.5)},${Math.round(g*.5)},${Math.round(b*.5)},.66)`,
    "--verre-sombre-b": `rgba(${Math.round(r*.62)},${Math.round(g*.62)},${Math.round(b*.62)},.46)`,
    "--glass-a": a(sombre ? 0.46 : 0.46),
    "--glass-b": a(sombre ? 0.15 : 0.16),
    "--glass-fort-a": a(0.94),
    "--glass-fort-b": a(0.64),
    "--glass-ombre": a(sombre ? 0.5 : 0.42),
    "--glass-danger-a": d(0.94),
    "--glass-danger-b": d(0.64),
    "--glass-danger-ombre": d(0.45),
    "--glass-bord": sombre ? "rgba(255,255,255,0.26)" : "rgba(255,255,255,0.72)",
    "--glass-reflet": sombre ? "rgba(255,255,255,0.42)" : "rgba(255,255,255,0.95)",
    "--glass-texte": sombre ? "#EEF2FF" : fonce(0.42)
  };
}

function appliquerTheme(themeId){
  const theme = THEMES[themeId] || THEMES.bleu;
  const racine = document.documentElement;
  const variables = {
    ...theme.variables,
    ...(theme.sombre ? SURFACES_SOMBRES : SURFACES_CLAIRES),
    "--filtre-fond": theme.sombre ? FILTRE_SOMBRE : FILTRE_AUCUN,
    ...varsVerre(theme)
  };
  Object.entries(variables).forEach(([variable, valeur])=>{
    racine.style.setProperty(variable, valeur);
  });
}

   ============================================================ */

  display:flex; flex-direction:column; justify-content:space-between;
  overflow:hidden;
  background:

.deconnexion,

.bouton-aujourdhui,
.bouton-succes,
.touche,
.ecran-pin .retour,
.btn-annuler,
.boutons-modale .btn-annuler,
.option-notif,
.bouton-option-edition,
.badge-camera,
.bouton-fermer,
.bouton-valider,

  user-select:none; -webkit-user-select:none;
}
/* reflet spéculaire du haut */
.deconnexion::before,
.selecteur-jour .fleche::before,
.bouton-aujourdhui::before,
.bouton-succes::before,
.touche::before,
.ecran-pin .retour::before,
.btn-annuler::before,
.boutons-modale .btn-annuler::before,
.option-notif::before,
.bouton-option-edition::before,
.badge-camera::before,
.bouton-fermer::before,
.bouton-valider::before,
.btn-confirmer::before,
.boutons-modale .btn-confirmer::before,
.bouton-edition-profil::before,
.option-notif.actif::before{
  content:"";
  position:absolute;
  left:7%; right:7%; top:0; height:46%;
  border-radius:inherit;
  background:linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0));
  opacity:.8;
  pointer-events:none;
  z-index:-1;
}
/* éclat liquide qui suit le doigt / la souris (--mx, --my posés en JS) */
.deconnexion::after,
.selecteur-jour .fleche::after,
.bouton-aujourdhui::after,
.bouton-succes::after,
.touche::after,
.ecran-pin .retour::after,
.btn-annuler::after,
.boutons-modale .btn-annuler::after,
.option-notif::after,
.bouton-option-edition::after,
.badge-camera::after,
.bouton-fermer::after,
.bouton-valider::after,
.btn-confirmer::after,
.boutons-modale .btn-confirmer::after,
.bouton-edition-profil::after,
.option-notif.actif::after{
  content:"";
  position:absolute; inset:0;
  border-radius:inherit;
  background:radial-gradient(110px 80px at var(--mx,50%) var(--my,0%), rgba(255,255,255,0.7), rgba(255,255,255,0) 70%);
  opacity:0;
  transition:opacity .3s ease;
  pointer-events:none;
  z-index:-1;
}

.ecran-pin .retour:hover,

.deconnexion:hover::after,

.boutons-modale .btn-annuler:hover::after,
.option-notif:hover::after,
.bouton-option-edition:hover::after,

.bouton-fermer:hover::after,

.deconnexion:active,
.selecteur-jour .fleche:active,
.bouton-aujourdhui:active,
.bouton-succes:active,
.touche:active,
.ecran-pin .retour:active,
.btn-annuler:active,
.boutons-modale .btn-annuler:active,
.option-notif:active,
.bouton-option-edition:active,
.badge-camera:active,

/* boutons « forts » : action principale, verre très teinté + texte blanc */

.btn-confirmer,
.boutons-modale .btn-confirmer,
.bouton-edition-profil,
.option-notif.actif{

  text-shadow:0 1px 2px rgba(0,0,0,0.28);

.bouton-valider:active,

/* tailles et formes propres à chaque bouton */
.deconnexion{ border-radius:999px; padding:9px 18px; font-weight:600; }
.selecteur-jour .fleche{ border-radius:50%; }
.bouton-aujourdhui{ border-radius:999px; }
.touche{ border-radius:22px; }
.ecran-pin .retour{ border-radius:999px; padding:8px 18px; margin-bottom:22px; font-weight:600; }
.bouton-valider{ border-radius:999px; padding:8px 16px; }
.boutons-modale .btn-annuler,
.boutons-modale .btn-confirmer{ border-radius:16px; padding:13px 0; }
.btn-confirmer{ border-radius:16px; }
.option-notif{ border-radius:16px; border:1px solid var(--glass-bord); }
.option-notif.actif{ border-color:rgba(255,255,255,0.5); color:#fff; }
.bouton-option-edition,
.bouton-edition-profil{ border:1px solid var(--glass-bord); }
.bouton-edition-profil{ border-color:rgba(255,255,255,0.5); }
.badge-camera{ border:1px solid var(--glass-bord); }
.bouton-fermer{
  width:32px; height:32px; padding:0;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}
.bouton-fermer svg{ width:16px; height:16px; }

/* anneau de focus clavier discret, aux couleurs du thème */

.selecteur-jour .fleche:focus-visible,
.bouton-aujourdhui:focus-visible,
.bouton-succes:focus-visible,
.btn-annuler:focus-visible,
.btn-confirmer:focus-visible,
.bouton-valider:focus-visible,
.bouton-option-edition:focus-visible,
.bouton-edition-profil:focus-visible,
.option-notif:focus-visible,
.bouton-fermer:focus-visible{

}

/* rangée « Revenir à aujourd'hui » + « Succès » */
.rangee-boutons{
  display:flex; justify-content:center; align-items:center;
  flex-wrap:wrap; gap:10px;
  margin:0 0 22px;
}
.rangee-boutons .bouton-aujourdhui{ margin:0; }
.bouton-succes{
  display:inline-flex; align-items:center; gap:7px;
  padding:9px 18px;
  font-family:'Poppins',sans-serif;
  font-size:0.78rem; font-weight:600;
  border-radius:999px;
  cursor:pointer;
}
.bouton-succes svg{ width:15px; height:15px; flex-shrink:0; }
.bouton-succes .compteur{
  padding:1px 8px;
  border-radius:999px;
  background:rgba(255,255,255,0.4);
  font-size:0.7rem;
}

/* pastilles de thème : petites bulles de verre colorées */
.pastille-theme{
  position:relative;
  overflow:hidden;
  isolation:isolate;
  background:
    radial-gradient(circle at 30% 22%, rgba(255,255,255,0.92) 0 9%, rgba(255,255,255,0) 38%),
    linear-gradient(160deg, rgba(255,255,255,0.38), rgba(255,255,255,0) 58%),
    var(--c, #3B82F6);
  border:2px solid rgba(255,255,255,0.72);
  box-shadow:
    inset 0 -7px 10px rgba(0,0,0,0.2),
    inset 0 2px 3px rgba(255,255,255,0.85),
    0 8px 16px -6px var(--c, #3B82F6),
    0 2px 6px rgba(15,23,42,0.18);
  transition:transform .32s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease;
}
@media (hover:hover){ .pastille-theme:hover{ transform:scale(1.12); } }
.pastille-theme:active{ transform:scale(.9); }
.pastille-theme.actif{
  border-color:#fff;
  transform:scale(1.16);
  box-shadow:
    inset 0 -7px 10px rgba(0,0,0,0.2),
    inset 0 2px 3px rgba(255,255,255,0.85),
    0 0 0 2.5px var(--texte),
    0 8px 16px -6px var(--c, #3B82F6);
}
.options-edition-profil .selecteur-theme{
  background:var(--verre-panneau);
  -webkit-backdrop-filter:blur(16px) saturate(170%);
  backdrop-filter:blur(16px) saturate(170%);
  border:1px solid var(--glass-bord);
  box-shadow:inset 0 1.5px 0 var(--glass-reflet), 0 12px 24px -10px var(--glass-ombre);
  border-radius:999px;
}

/* ============================================================
   ANIMATIONS DE PAGE
   ============================================================ */
@keyframes anim-monter{ from{ opacity:0; transform:translate3d(0,26px,0) scale(.97); } to{ opacity:1; transform:none; } }
@keyframes anim-descendre{ from{ opacity:0; transform:translate3d(0,-22px,0); } to{ opacity:1; transform:none; } }
@keyframes anim-droite{ from{ opacity:0; transform:translate3d(36px,0,0); } to{ opacity:1; transform:none; } }
@keyframes anim-gauche{ from{ opacity:0; transform:translate3d(-36px,0,0); } to{ opacity:1; transform:none; } }
@keyframes anim-fondu{ from{ opacity:0; } to{ opacity:1; } }
@keyframes anim-pop-in{ from{ opacity:0; transform:scale(.55); } to{ opacity:1; transform:none; } }
@keyframes anim-zoom-ecran{ from{ opacity:0; transform:scale(1.05); } to{ opacity:1; transform:none; } }
@keyframes anim-sortie-gauche{ to{ opacity:0; transform:translate3d(-30px,0,0) scale(.98); } }
@keyframes anim-sortie-bas{ to{ opacity:0; transform:translate3d(0,22px,0) scale(.98); } }
@keyframes anim-sortie-ecran{ to{ opacity:0; transform:scale(.97); } }
@keyframes anim-jour-suivant{ from{ opacity:0; transform:translate3d(46px,0,0); } to{ opacity:1; transform:none; } }
@keyframes anim-jour-precedent{ from{ opacity:0; transform:translate3d(-46px,0,0); } to{ opacity:1; transform:none; } }
@keyframes anim-secouer{
  0%,100%{ transform:translateX(0); }
  18%{ transform:translateX(-10px); } 36%{ transform:translateX(9px); }
  54%{ transform:translateX(-6px); } 72%{ transform:translateX(4px); }
}
@keyframes anim-case{
  0%{ transform:scale(.4) rotate(-12deg); }
  55%{ transform:scale(1.28) rotate(6deg); }
  100%{ transform:scale(1) rotate(0); }
}
@keyframes anim-onde{
  0%{ box-shadow:0 0 0 0 rgba(var(--onde-rgb, 108,140,255),.55); }
  100%{ box-shadow:0 0 0 16px rgba(var(--onde-rgb, 108,140,255),0); }
}

/* écran de sélection */
.ecran-selection.anim-entree{ animation:anim-zoom-ecran .55s cubic-bezier(.22,1,.36,1) backwards; }
.ecran-selection.anim-entree .selection-header{ animation:anim-descendre .6s cubic-bezier(.22,1,.36,1) .08s backwards; }
.ecran-selection.anim-entree .carousel-famille{ animation:anim-monter .7s cubic-bezier(.22,1,.36,1) .12s backwards; }
.ecran-selection.sortie{ animation:anim-sortie-ecran .2s ease-in forwards; }

/* écran du code */
.ecran-pin.anim-entree > *{
  animation:anim-droite .5s cubic-bezier(.22,1,.36,1) backwards;
  animation-delay:calc(var(--i,0) * 55ms);
}
.ecran-pin.anim-entree.entree-depuis-taches > *{ animation-name:anim-gauche; }
.ecran-pin.anim-entree > *:nth-child(1){ --i:0; }
.ecran-pin.anim-entree > *:nth-child(2){ --i:1; }
.ecran-pin.anim-entree > *:nth-child(3){ --i:2; }
.ecran-pin.anim-entree > *:nth-child(4){ --i:3; }
.ecran-pin.anim-entree > *:nth-child(5){ --i:4; }
.ecran-pin.anim-entree > *:nth-child(6){ --i:5; }
.ecran-pin.anim-entree > *:nth-child(7){ --i:6; }
.ecran-pin.anim-entree .pavé-numerique > *{
  animation:anim-pop-in .45s cubic-bezier(.34,1.56,.64,1) backwards;
  animation-delay:calc(160ms + var(--k,0) * 28ms);
}
.ecran-pin.anim-entree .pavé-numerique > *:nth-child(1){ --k:1; }
.ecran-pin.anim-entree .pavé-numerique > *:nth-child(2){ --k:2; }
.ecran-pin.anim-entree .pavé-numerique > *:nth-child(3){ --k:3; }
.ecran-pin.anim-entree .pavé-numerique > *:nth-child(4){ --k:4; }
.ecran-pin.anim-entree .pavé-numerique > *:nth-child(5){ --k:5; }
.ecran-pin.anim-entree .pavé-numerique > *:nth-child(6){ --k:6; }
.ecran-pin.anim-entree .pavé-numerique > *:nth-child(7){ --k:7; }
.ecran-pin.anim-entree .pavé-numerique > *:nth-child(8){ --k:8; }
.ecran-pin.anim-entree .pavé-numerique > *:nth-child(9){ --k:9; }
.ecran-pin.anim-entree .pavé-numerique > *:nth-child(10){ --k:10; }
.ecran-pin.anim-entree .pavé-numerique > *:nth-child(11){ --k:11; }
.ecran-pin.anim-entree .pavé-numerique > *:nth-child(12){ --k:12; }
.ecran-pin.sortie > *{ animation:anim-sortie-gauche .2s ease-in forwards; }
.pin-points.secoue{ animation:anim-secouer .45s ease; }

/* écran des tâches : les blocs montent l'un après l'autre */
.ecran-taches.anim-entree > *{
  animation:anim-monter .55s cubic-bezier(.22,1,.36,1) backwards;
  animation-delay:calc(var(--i,0) * 75ms);
}
.ecran-taches.anim-entree > *:nth-child(1){ --i:0; }
.ecran-taches.anim-entree > *:nth-child(2){ --i:1; }
.ecran-taches.anim-entree > *:nth-child(3){ --i:2; }
.ecran-taches.anim-entree > *:nth-child(4){ --i:3; }
.ecran-taches.anim-entree > *:nth-child(5){ --i:4; }
.ecran-taches.anim-entree > *:nth-child(6){ --i:5; }
.ecran-taches.sortie > *{ animation:anim-sortie-bas .2s ease-in forwards; }

/* changement de jour : le contenu glisse du côté où l'on va */
.contenu-jour.glisse-suivant{ animation:anim-jour-suivant .42s cubic-bezier(.22,1,.36,1) backwards; }
.contenu-jour.glisse-precedent{ animation:anim-jour-precedent .42s cubic-bezier(.22,1,.36,1) backwards; }
.contenu-jour.glisse-fondu{ animation:anim-fondu .4s ease backwards; }
.date-texte.change-suivant{ animation:anim-jour-suivant .38s cubic-bezier(.22,1,.36,1) backwards; }
.date-texte.change-precedent{ animation:anim-jour-precedent .38s cubic-bezier(.22,1,.36,1) backwards; }
.date-texte.change-fondu{ animation:anim-fondu .35s ease backwards; }
.contenu-jour[class*="glisse-"] .tache{
  animation:anim-monter .45s cubic-bezier(.22,1,.36,1) backwards;
  animation-delay:calc(60ms + var(--k,0) * 45ms);
}
.contenu-jour[class*="glisse-"] .tache:nth-child(1){ --k:1; }
.contenu-jour[class*="glisse-"] .tache:nth-child(2){ --k:2; }
.contenu-jour[class*="glisse-"] .tache:nth-child(3){ --k:3; }
.contenu-jour[class*="glisse-"] .tache:nth-child(4){ --k:4; }
.contenu-jour[class*="glisse-"] .tache:nth-child(5){ --k:5; }
.contenu-jour[class*="glisse-"] .tache:nth-child(6){ --k:6; }
.contenu-jour[class*="glisse-"] .tache:nth-child(7){ --k:7; }
.contenu-jour[class*="glisse-"] .tache:nth-child(8){ --k:8; }
.contenu-jour[class*="glisse-"] .tache:nth-child(9){ --k:9; }
.contenu-jour[class*="glisse-"] .tache:nth-child(10){ --k:10; }

/* case qui se coche / se valide */
.case.anim-pop{ animation:anim-case .55s cubic-bezier(.34,1.56,.64,1); }
.case.valide.anim-pop{ animation:anim-case .55s cubic-bezier(.34,1.56,.64,1), anim-onde .8s ease-out; }

/* fenêtres modales */
.fond-modale{ animation:anim-fondu .22s ease; }
.boite-modale,
.boite-succes{ animation:anim-pop-in .38s cubic-bezier(.34,1.56,.64,1); }

#app{ overflow-x:clip; }

/* ============================================================
   SUCCÈS : toast + panneau
   ============================================================ */
.toasts-succes{
  position:fixed; top:14px; left:0; right:0;
  z-index:2000;
  display:flex; flex-direction:column; align-items:center; gap:10px;
  padding:0 14px;
  pointer-events:none;
}
.toast-succes{
  pointer-events:auto;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  isolation:isolate;
  display:flex; align-items:center; gap:13px;
  width:100%; max-width:410px;
  padding:11px 18px 11px 11px;
  border-radius:26px;
  background:linear-gradient(150deg, var(--glass-a), var(--glass-b)), var(--verre-panneau);
  -webkit-backdrop-filter:blur(20px) saturate(190%);
  backdrop-filter:blur(20px) saturate(190%);
  border:1px solid var(--glass-bord);
  box-shadow:
    inset 0 1.5px 0 var(--glass-reflet),
    inset 0 -12px 18px -10px rgba(255,255,255,0.25),
    0 18px 36px -12px var(--glass-ombre),
    0 4px 14px rgba(15,23,42,0.18);
  animation:toast-entree .7s cubic-bezier(.34,1.56,.64,1) both;
}
.toast-succes::before{
  content:""; position:absolute; left:6%; right:6%; top:0; height:46%;
  border-radius:inherit;
  background:linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0));
  pointer-events:none; z-index:-1;
}
.toast-succes::after{
  content:""; position:absolute; top:0; bottom:0; width:60%; left:-80%;
  background:linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,0.65), rgba(255,255,255,0));
  transform:skewX(-18deg);
  animation:toast-brillance 1.4s ease .45s 1 both;
  pointer-events:none; z-index:-1;
}
.toast-succes.sortie{ animation:toast-sortie .42s cubic-bezier(.5,0,.75,0) forwards; }
@keyframes toast-entree{
  0%{ opacity:0; transform:translate3d(0,-90px,0) scale(.82); }
  100%{ opacity:1; transform:none; }
}
@keyframes toast-sortie{ to{ opacity:0; transform:translate3d(0,-70px,0) scale(.9); } }

<script>
/* ============================================================
   INITIALISATION
   ============================================================ */
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
emailjs.init(EMAILJS_PUBLIC_KEY);

const DOC_REF = db.collection("carnet_maison").doc("etat_taches");

const JOURS_SEMAINE = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

let etatCourant = { completions: {}, profils: {} }; // synchronisé avec Firestore
let personneActive = null;             // clé de PERSONNES
let pinSaisi = "";
let dateAffichee = new Date();
let vueActuelle = "login"; // login | pin | taches
let editionProfilOuverte = false;

/* ---- Animations de page ---- */
let vueRendue = null;          // dernière vue réellement affichée (pour détecter un changement de page)
let enTransition = false;      // une animation de sortie est en cours
let animJour = null;           // "suivant" | "precedent" | "fondu" : sens du dernier changement de jour
const animCles = new Set();    // tâches à animer (cochées / validées) au prochain rendu

function mouvementReduit(){
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

/* Joue l'animation de sortie de l'écran actuel, puis exécute le changement de vue */
function allerVue(changer){
  if(enTransition) return;
  const ecran = document.getElementById("app").firstElementChild;
  if(!ecran || mouvementReduit()){ changer(); return; }
  enTransition = true;
  ecran.classList.add('sortie');
  setTimeout(()=>{ enTransition = false; changer(); }, 200);
}

/* Après un rendu : si la page a changé, l'écran joue son animation d'entrée */
function appliquerEntree(app){
  if(vueActuelle === "login" && !app.querySelector('.famille-card')) return; // écran encore vide
  const precedente = vueRendue;
  vueRendue = vueActuelle;
  if(precedente === vueActuelle || mouvementReduit()) return;
  const ecran = app.firstElementChild;
  if(!ecran) return;
  ecran.classList.add('anim-entree', 'entree-depuis-' + (precedente || 'demarrage'));
  setTimeout(()=>{ ecran.classList.remove('anim-entree', 'entree-depuis-' + (precedente || 'demarrage')); }, 1400);
}

/* ---- Écoute en temps réel de Firestore ---- */
function marquerAnimations(ancien, nouveau){
  if(vueActuelle !== "taches") return;
  const avant = (ancien && ancien.completions) || {};
  Object.entries((nouveau && nouveau.completions) || {}).forEach(([cle, info])=>{
    const o = avant[cle] || {};
    if((info.valide && !o.valide) || (info.fait && !o.fait)) animCles.add(cle);
  });
}

DOC_REF.onSnapshot((snap) => {
  const ancienEtat = etatCourant;
  if (snap.exists) {
    etatCourant = snap.data();
    if(!etatCourant.completions) etatCourant.completions = {};
    if(!etatCourant.profils) etatCourant.profils = {};
  } else {
    etatCourant = { completions: {}, profils: {} };
    DOC_REF.set(etatCourant);
  }
  marquerAnimations(ancienEtat, etatCourant);
  rendre();
  verifierDigestQuotidien();
}, (err) => {
  console.error("Erreur Firestore :", err);
});

/* ---- Utilitaires date ---- */
function formatDateCle(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function nomJour(d){ return JOURS_SEMAINE[d.getDay()]; }
function texteDateLisible(d){
  const jourNom = d.toLocaleDateString('fr-FR', { weekday:'long' });
  const reste = d.toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
  return { jourNom, reste };
}

/* ---- Clé de complétion unique ---- */
function cleCompletion(personneId, dateCle, index){
  return `${dateCle}_${personneId}_${index}`;
}

/* ---- Profils (thème + photo) ---- */
const PHOTOS_LOCALES_KEY = "carnet_maison_photos";
let PHOTOS_LOCALES = {};
try{
  const cachePhotos = JSON.parse(localStorage.getItem(PHOTOS_LOCALES_KEY) || "{}");
  if(cachePhotos && typeof cachePhotos === "object" && !Array.isArray(cachePhotos)) PHOTOS_LOCALES = cachePhotos;
}catch(e){
  console.warn("Impossible de lire le cache local des photos:", e);
}

function obtenirPhotoLocale(personneId){
  const photo = PHOTOS_LOCALES[personneId];
  return typeof photo === "string" ? photo : (photo && photo.dataUrl) || "";
}

function datePhotoLocale(personneId){
  const photo = PHOTOS_LOCALES[personneId];
  return photo && typeof photo === "object" ? Number(photo.updatedAt) || 0 : 0;
}

function sauvegarderPhotoLocale(personneId, dataUrl){
  const photos = { ...PHOTOS_LOCALES, [personneId]: { dataUrl, updatedAt: Date.now() } };
  PHOTOS_LOCALES = photos;
  try{
    localStorage.setItem(PHOTOS_LOCALES_KEY, JSON.stringify(photos));
    return true;
  }catch(e){
    console.error("Impossible d'enregistrer la photo dans le cache local:", e);
    return false;
  }
}

function supprimerPhotoLocale(personneId){
  const photos = { ...PHOTOS_LOCALES };
  delete photos[personneId];
  try{
    if(Object.keys(photos).length) localStorage.setItem(PHOTOS_LOCALES_KEY, JSON.stringify(photos));
    else localStorage.removeItem(PHOTOS_LOCALES_KEY);
    PHOTOS_LOCALES = photos;
  }catch(e){
    console.warn("Impossible de supprimer la photo du cache local:", e);
  }
}

function blobEnDataUrl(blob){
  return new Promise((resolve, reject)=>{
    const lecteur = new FileReader();
    lecteur.onload = () => resolve(lecteur.result);
    lecteur.onerror = () => reject(lecteur.error);
    lecteur.readAsDataURL(blob);
  });
}

function obtenirProfil(personneId){
  return (etatCourant.profils && etatCourant.profils[personneId]) || {};
}

function obtenirPhotoProfil(personneId){
  const profil = obtenirProfil(personneId);
  const dateFirebase = profil.photoUpdatedAt && typeof profil.photoUpdatedAt.toMillis === "function"
    ? profil.photoUpdatedAt.toMillis()
    : Number(profil.photoUpdatedAt) || 0;
  const photoLocale = obtenirPhotoLocale(personneId);
  if(photoLocale && (!profil.photo || datePhotoLocale(personneId) > dateFirebase)) return photoLocale;
  return profil.photo || photoLocale;
}

function obtenirMetaPersonne(personneId){
  // La photo Firebase ou le cache local prennent le dessus sur l'image du dépôt.
  const img = IMAGES_PERSONNES[personneId] || {};
  return {
    avatar: obtenirPhotoProfil(personneId) || img.icone || "",
    banner: obtenirProfil(personneId).banner || img.banniere || ""
  };
}

function rendreAvatar(personneId, classe){
  const profil = obtenirProfil(personneId);
  const nom = PERSONNES[personneId] ? PERSONNES[personneId].nom : "?";
  const initiale = nom.charAt(0).toUpperCase();
  const image = obtenirMetaPersonne(personneId).avatar;
  if(image){
    return `<div class="avatar ${classe}"><img src="${image}" alt="${nom}" onerror="this.style.display='none'; this.parentElement.textContent='${initiale}';"></div>`;
  }
  return `<div class="avatar ${classe}">${initiale}</div>`;
}

function rendreAvatarEditable(personneId){
  const interieur = rendreAvatar(personneId, "avatar-grand").replace('class="avatar avatar-grand"', 'class="avatar avatar-grand" onclick="declencherChangementPhoto()"');
  return `<div style="position:relative;display:inline-block;">
      ${interieur}
      <div class="badge-camera">${ICONES.camera}</div>
    </div>`;
}

/* ============================================================
   ACTIONS
   ============================================================ */
const INACTIVITE_AVANT_POPUP_MS = 10_000;
const INACTIVITE_AVANT_DECONNEXION_MS = 15_000;
let derniereActiviteSession = 0;
let minuteurInactivite = null;
let intervalleInactivite = null;
let deconnexionInactiviteEnCours = false;

function arreterSurveillanceInactivite(){
  clearTimeout(minuteurInactivite);
  clearInterval(intervalleInactivite);
  minuteurInactivite = null;
  intervalleInactivite = null;
  derniereActiviteSession = 0;
  document.getElementById("fond-modale-inactivite").style.display = "none";
}

function verifierInactivite(){
  clearTimeout(minuteurInactivite);
  minuteurInactivite = null;
  if(vueActuelle !== "taches" || !personneActive){
    arreterSurveillanceInactivite();
    return;
  }

  const inactivite = Date.now() - derniereActiviteSession;
  if(inactivite >= INACTIVITE_AVANT_DECONNEXION_MS){
    deconnexionInactiviteEnCours = true;
    arreterSurveillanceInactivite();
    retourLogin();
    return;
  }

  if(inactivite >= INACTIVITE_AVANT_POPUP_MS){
    document.getElementById("fond-modale-inactivite").style.display = "flex";
    const restantes = Math.ceil((INACTIVITE_AVANT_DECONNEXION_MS - inactivite) / 1000);
    document.getElementById("compte-rebours-inactivite").textContent = restantes;
    if(!intervalleInactivite) intervalleInactivite = setInterval(verifierInactivite, 250);
    return;
  }

  document.getElementById("fond-modale-inactivite").style.display = "none";
  clearInterval(intervalleInactivite);
  intervalleInactivite = null;
  minuteurInactivite = setTimeout(verifierInactivite, INACTIVITE_AVANT_POPUP_MS - inactivite);
}

function enregistrerActivite(){
  if(vueActuelle !== "taches" || !personneActive || deconnexionInactiviteEnCours) return;
  derniereActiviteSession = Date.now();
  verifierInactivite();
}

function demarrerSurveillanceInactivite(){
  deconnexionInactiviteEnCours = false;
  derniereActiviteSession = Date.now();
  verifierInactivite();
}

function ouvrirEcranPin(id){
  allerVue(()=>{
    personneActive = id;
    pinSaisi = "";
    vueActuelle = "pin";
    appliquerTheme(obtenirProfil(id).theme || "bleu");
    rendre();
  });
}

function retourLogin(){
  arreterSurveillanceInactivite();
  allerVue(()=>{
    personneActive = null;
    pinSaisi = "";
    vueActuelle = "login";
    appliquerTheme("bleu");
    fermerSucces();
    rendre();
  });
}

function saisirChiffre(chiffre){
  if(pinSaisi.length>=4) return;
  pinSaisi += chiffre;
  if(pinSaisi.length===4){
    if(pinSaisi === PERSONNES[personneActive].pin){
      rendre(); // le 4e point se remplit, puis on change de page
      setTimeout(()=>{
        allerVue(()=>{
          vueActuelle = "taches";
          dateAffichee = new Date();
          appliquerTheme(obtenirProfil(personneActive).theme || "bleu");
          rendre();
          demarrerSurveillanceInactivite();
        });
      }, 170);
      return;
    } else {
      setTimeout(()=>{ pinSaisi=""; rendre(); const pts = document.querySelector('.pin-points'); if(pts) pts.classList.add('secoue'); document.getElementById("erreur-pin").textContent = PERSONNES[personneActive].horsConfig ? "Fichier de configuration introuvable (config/" + personneActive + ".json)." : "Code incorrect, réessaie."; }, 250);
    }
  }
  rendre();
}

function effacerChiffre(){
  pinSaisi = pinSaisi.slice(0,-1);
  rendre();
}

function changerJour(delta){
  dateAffichee = new Date(dateAffichee);
  dateAffichee.setDate(dateAffichee.getDate()+delta);
  animJour = delta > 0 ? "suivant" : "precedent";
  rendre();
}

function allerAujourdhui(){
  dateAffichee = new Date();
  animJour = "fondu";
  rendre();
}

let enTraitement = new Set(); // empêche un double-clic d'envoyer 2x la même action
let actionEnAttente = null;   // {personneId, index, texte} en attente de confirmation dans la modale

function toggleTache(personneId, index){
  demanderConfirmation(personneId, index);
}

function demanderConfirmation(personneId, index){
  const jour = nomJour(dateAffichee);
  const texte = TACHES[personneId][jour][index];
  actionEnAttente = { personneId, index, texte };
  document.getElementById("texte-modale").innerHTML =
    `Confirmer que la tâche                   <strong>${texte}</strong> est terminée ?`;
  document.getElementById("fond-modale").style.display = "flex";
}

function annulerAction(){
  actionEnAttente = null;
  document.getElementById("fond-modale").style.display = "none";
}

function confirmerAction(){
  if(!actionEnAttente) return;
  const { personneId, index } = actionEnAttente;
  document.getElementById("fond-modale").style.display = "none";
  actionEnAttente = null;
  marquerTacheFaite(personneId, index);
}

async function marquerTacheFaite(personneId, index){
  const dateCle = formatDateCle(dateAffichee);
  const cle = cleCompletion(personneId, dateCle, index);

  // Verrou anti double-clic / double-tap
  if(enTraitement.has(cle)) return;
  enTraitement.add(cle);

  const nouvelEtat = { ...etatCourant, completions: { ...etatCourant.completions } };
  nouvelEtat.completions[cle] = {
    fait:true,
    valide:false,
    par: PERSONNES[personneId].nom,
    horodatage: new Date().toISOString()
  };

  // Mise à jour optimiste immédiate (locale)
  etatCourant = nouvelEtat;
  animCles.add(cle);
  rendre();

  if(PERSONNES[personneId].type === "enfant"){
    const nomTache = TACHES[personneId][nomJour(dateAffichee)][index];
    notifierParents(PERSONNES[personneId].nom, nomTache);
  }

  try{
    await DOC_REF.set(nouvelEtat);
  }catch(e){
    console.error("Erreur d'écriture Firestore:", e);
    alert("Impossible de synchroniser la tâche. Vérifie ta connexion internet.");
  } finally {
    enTraitement.delete(cle);
  }
}

function redimensionnerImage(fichier, tailleMax){
  return new Promise((resolve, reject)=>{
    const lecteur = new FileReader();
    lecteur.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height){
          if(width > tailleMax){ height *= tailleMax/width; width = tailleMax; }
        } else {
          if(height > tailleMax){ width *= tailleMax/height; height = tailleMax; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob)=> resolve(blob), "image/jpeg", 0.72);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    lecteur.onerror = reject;
    lecteur.readAsDataURL(fichier);
  });
}

async function gererFichierPhoto(event){

  if(!fichier || !personneActive) return;

        : "Firebase a refusé la photo et le navigateur n'a pas pu l'enregistrer dans son cache.");
    }catch(erreurCache){
      console.error("Erreur de sauvegarde locale de la photo:", erreurCache);

/* ============================================================
   ENVOI DE COURRIELS — file d'attente + préférences par parent
   EmailJS (plan gratuit) limite à 1 requête toutes les 5 secondes.
   IMPORTANT : le champ "To Email" du template EmailJS doit utiliser
   la variable {{to_email}} (et non des adresses codées en dur),
   car chaque parent peut maintenant recevoir des courriels
   différents selon ses préférences.
   ============================================================ */
const DELAI_ENTRE_COURRIELS_MS = 5200; // légère marge au-dessus de 5s
let fileCourriels = [];
let fileEnCours = false;

function notifierParents(nomEnfant, nomTache){
  Object.entries(PERSONNES).forEach(([id, p])=>{
    if(p.type !== "parent") return;
    const email = obtenirEmailParent(id, p);
    if(!email){
      console.warn(`Aucun courriel trouvé pour le parent "${id}" — notification ignorée. Ajoute "email" dans config/${id}.json.`);
      return;
    }
    const pref = obtenirNotifPref(id);
    if(pref.mode === "quotidien") return; // ce parent recevra un résumé plus tard, pas un courriel immédiat
    fileCourriels.push({ email, nomEnfant, nomTache });
  });
  traiterFileCourriels();
}

function traiterFileCourriels(){
  if(fileEnCours) return;
  fileEnCours = true;

  const envoyerSuivant = () => {
    const item = fileCourriels.shift();
    if(!item){ fileEnCours = false; return; }

    emailjs.send(EMAILJS_SERVICE_ID, item.templateId || EMAILJS_TEMPLATE_ID, item.params || {
      to_email: item.email,
      child_name: item.nomEnfant,
      task_name: item.nomTache,
      message: `${item.nomEnfant} a terminé "${item.nomTache}". Veuillez vérifier puis valider la complétion.`
    }).then(()=>{
      console.log(`Courriel envoyé à ${item.email} pour la tâche "${item.nomTache}".`);
    }).catch((err)=>{ console.error("Erreur EmailJS:", err); if(item.surEchec) item.surEchec(); });

    if(fileCourriels.length > 0){
      setTimeout(envoyerSuivant, DELAI_ENTRE_COURRIELS_MS);
    } else {
      fileEnCours = false;
    }
  };

  envoyerSuivant();
}

/* ============================================================
   RÉSUMÉ QUOTIDIEN (parents ayant choisi "une fois par jour")
   Approche "simple" : vérifiée à chaque chargement de l'app et à
   intervalle régulier tant que l'app reste ouverte. Si personne
   n'ouvre l'app autour de l'heure choisie, le résumé de ce jour-là
   peut être manqué (limite d'un site statique sans serveur).
   ============================================================ */
let digestEnCours = new Set();

/* Liste HTML des tâches faites mais pas encore validées pour une date, groupées par enfant */
function construireListeDigest(dateCle){
  const parEnfant = {};
  const jour = JOURS_SEMAINE[new Date(dateCle + "T12:00:00").getDay()];
  Object.entries(etatCourant.completions || {}).forEach(([cle, info])=>{
    if(!info || !info.fait || info.valide || !cle.startsWith(dateCle + "_")) return;
    const [, pid, idx] = cle.split("_");
    const nomTache = ((TACHES[pid] || {})[jour] || [])[Number(idx)];
    if(!nomTache || !PERSONNES[pid]) return;
    (parEnfant[pid] = parEnfant[pid] || []).push(nomTache);
  });
  const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return Object.entries(parEnfant).map(([pid, taches]) =>
    `<strong>${esc(PERSONNES[pid].nom)}</strong><ul style="margin:6px 0 12px;padding-left:20px;">${taches.map(t => `<li>${esc(t)}</li>`).join("")}</ul>`
  ).join("");
}

/* Réserve l'envoi du jour de façon atomique : un seul appareil l'obtient, même si plusieurs sont ouverts */
async function reclamerDigest(cleDigest){
  try{
    return await db.runTransaction(async (tx)=>{
      const snap = await tx.get(DOC_REF);
      const deja = snap.exists && snap.data().digestEnvoye && snap.data().digestEnvoye[cleDigest];
      if(deja) return false;
      tx.set(DOC_REF, { digestEnvoye: { [cleDigest]: true } }, { merge: true });
      return true;
    });
  }catch(e){
    console.error("Erreur de réservation du résumé quotidien:", e);
    return false;
  }
}

/* Si l'envoi échoue, on libère la réservation pour réessayer à la prochaine vérification */
function libererDigest(cleDigest){
  const envoye = { ...(etatCourant.digestEnvoye || {}) };
  delete envoye[cleDigest];
  etatCourant = { ...etatCourant, digestEnvoye: envoye };
  DOC_REF.update({ ["digestEnvoye." + cleDigest]: firebase.firestore.FieldValue.delete() })
    .catch((e)=> console.error("Erreur de libération du résumé quotidien:", e));
}

function verifierDigestQuotidien(){
  if(Object.keys(PERSONNES).length === 0) return;
  const maintenant = new Date();
  const heureCourante = String(maintenant.getHours()).padStart(2,"0") + ":" + String(maintenant.getMinutes()).padStart(2,"0");
  const dateCle = formatDateCle(maintenant);

  Object.entries(PERSONNES).forEach(async ([id, p])=>{
    if(p.type !== "parent") return;
    const email = obtenirEmailParent(id, p);
    if(!email) return;
    const pref = obtenirNotifPref(id);
    if(pref.mode !== "quotidien") return;

    const cleDigest = `${dateCle}_${id}`;
    if(digestEnCours.has(cleDigest)) return;
    if(etatCourant.digestEnvoye && etatCourant.digestEnvoye[cleDigest]) return;
    if(heureCourante < pref.heure) return;

    const liste = construireListeDigest(dateCle);
    if(!liste) return; // rien à valider aujourd'hui : pas de courriel

    digestEnCours.add(cleDigest);
    try{
      if(await reclamerDigest(cleDigest)){
        etatCourant = { ...etatCourant, digestEnvoye: { ...(etatCourant.digestEnvoye || {}), [cleDigest]: true } };
        const { jourNom, reste } = texteDateLisible(maintenant);
        fileCourriels.push({
          email,
          templateId: EMAILJS_TEMPLATE_DIGEST_ID,
          params: { to_email: email, parent_name: p.nom, date: `${jourNom} ${reste}`, tasks_list: liste },
          surEchec: () => libererDigest(cleDigest)
        });
        traiterFileCourriels();
      }
    } finally {
      digestEnCours.delete(cleDigest);
    }
  });
}

/* Revient sur l'onglet / l'app : on revérifie tout de suite */
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) verifierDigestQuotidien(); });

/* ============================================================
   RENDU
   ============================================================ */
/* ============================================================
   CARROUSEL DE SÉLECTION — style « menu Switch Sports »
   Physique : on glisse au doigt / à la souris (la carte suit),
   on relâche = inertie (lancer), puis un ressort aimante la
   carte la plus proche avec un petit rebond. Effet élastique
   aux deux extrémités. Un tap sur une carte la centre ; un tap
   sur la carte centrale ouvre l'écran du code.
   Aussi : flèches ← → + Entrée, et molette / pavé tactile.
   ============================================================ */
const CAR = {
  pos: null,        // position fractionnaire, en « index de carte »
  vel: 0,           // vitesse (cartes / seconde)
  cible: null,      // index visé par le ressort (null = carte la plus proche)
  drag: false, id: null, moved: false,
  startX: 0, startPos: 0, prevPos: 0, lastT: 0,
  carteDown: null,
  raf: null, tPrev: 0,
  prete: false, derniereRoue: 0,
  fondActif: null, fondZ: 1, fondTimer: null   // bannière affichée, pile des calques, minuterie de fin de fondu
};
const FOND_FONDU_MS = 1200; // durée du fondu entre deux bannières (en millisecondes)

function carMesures(){
  const el = document.querySelector('.carousel-famille');
  if(!el) return null;
  const W = el.clientWidth || window.innerWidth;
  const cw = Math.max(150, Math.min(260, W * 0.31));
  if(el.dataset.cw !== String(Math.round(cw))){
    el.dataset.cw = String(Math.round(cw));
    el.style.setProperty('--cw', cw + 'px');
  }
  return { el, cw, s1: cw * 0.91 + 14, s2: cw * 0.6 };
}

function carX(ds, m){
  const d = Math.abs(ds);
  const f = d <= 1 ? d * m.s1 : m.s1 + (d - 1) * m.s2;
  return ds < 0 ? -f : f;
}

/* Couleur de la carte = couleur d'accent du thème choisi par la personne (stocké dans Firebase :
   profils[id].theme). Centre = couleur pleine ; plus la carte s'éloigne, plus elle s'éclaircit. */
function carHexVersRgb(hex){
  const h = String(hex).replace('#', '');
  return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16));
}

function carCouleur(personneId, d){
  const theme = THEMES[obtenirProfil(personneId).theme] || THEMES.bleu;
  const base = carHexVersRgb(theme.variables["--accent"]);
  const t = d <= 1 ? 0.22 * d : Math.min(0.47, 0.22 + 0.25 * (d - 1));
  return base.map(v => Math.round(v + (255 - v) * t)).join(',');
}

/* Écart signé entre la carte i et la position du carrousel.
   En boucle (3 personnes ou plus) il est ramené dans ]-n/2 ; n/2] : le carrousel tourne sans fin. */
function carEcart(i, pos, n){
  let ds = i - pos;
  if(n >= 3){
    ds = ((ds % n) + n) % n;
    if(ds > n / 2) ds -= n;
  }
  return ds;
}

function carModulo(v, n){
  return n ? ((v % n) + n) % n : 0;
}

function carElastique(v, n){
  if(n >= 3) return v;               // boucle infinie : pas de butée
  const max = n - 1;
  if(v < 0) return v * 0.35;
  if(v > max) return max + (v - max) * 0.35;
  return v;
}

function carAppliquer(){
  if(CAR.pos === null) return;
  const m = carMesures();
  if(!m) return;
  const n = obtenirIdsPersonnes().length;
  const demi = n / 2;
  const larg = Math.min(1, Math.max(0.3, demi - 1));
  m.el.querySelectorAll('.famille-card').forEach(carte => {
    const i = Number(carte.dataset.index);
    const ds = carEcart(i, CAR.pos, n);
    const d = Math.abs(ds);
    const x = carX(ds, m);
    const echelle = d <= 1 ? 1 - 0.18 * d : Math.max(0.6, 0.82 - 0.11 * (d - 1));
    const lift = d <= 1 ? 8 * d : 8 + Math.min(d - 1, 1.5) * 16;
    // en boucle, la carte s'efface avant de repasser de l'autre côté du cercle
    const opa = n >= 3 ? Math.max(0, Math.min(1, (demi - d) / larg))
                       : Math.max(0, Math.min(1, 3.6 - d));
    const st = carte.style;
    st.transform = `translate3d(${x.toFixed(2)}px,${(-lift).toFixed(2)}px,0) scale(${echelle.toFixed(4)})`;
    st.zIndex = String(100 - Math.round(d * 10));
    st.setProperty('--c', carCouleur(carte.dataset.id, d));
    st.opacity = opa.toFixed(3);
    st.visibility = opa <= 0.01 ? 'hidden' : 'visible';
  });
  carFond(n);
}

/* Fond : quand la personne au centre change, sa bannière apparaît en fondu (FOND_FONDU_MS)
   AU-DESSUS de l'ancienne, qui reste en place jusqu'à la fin du fondu (pas de « trou »). */
function carFond(n){
  const calques = document.querySelectorAll('.fond-calque');
  if(!calques.length || !n) return;
  const proche = carModulo(Math.round(CAR.pos), n);
  if(CAR.fondActif === proche) return;
  const premier = CAR.fondActif === null;
  CAR.fondActif = proche;
  CAR.fondZ += 1;
  clearTimeout(CAR.fondTimer);
  const nouveau = Array.from(calques).find(c => Number(c.dataset.index) === proche);
  if(!nouveau) return;

  if(premier){ // premier affichage : pas de fondu
    calques.forEach(c => { c.style.transition = 'none'; c.style.opacity = (c === nouveau) ? '1' : '0'; });
    nouveau.style.zIndex = String(CAR.fondZ);
    void nouveau.offsetWidth;
    calques.forEach(c => { c.style.transition = ''; });
    return;
  }
  nouveau.style.transition = '';
  void nouveau.offsetWidth;
  nouveau.style.zIndex = String(CAR.fondZ);
  nouveau.style.opacity = '1';
  CAR.fondTimer = setTimeout(() => {
    calques.forEach(c => {
      if(c !== nouveau){ c.style.transition = 'none'; c.style.opacity = '0'; }
    });
  }, FOND_FONDU_MS + 50);
}

function carDemarrer(){
  if(CAR.raf) return;
  CAR.tPrev = performance.now();
  CAR.raf = requestAnimationFrame(carBoucle);
}

function carBoucle(t){
  CAR.raf = null;
  if(vueActuelle !== "login") return;
  const n = obtenirIdsPersonnes().length;
  const dt = Math.min((t - CAR.tPrev) / 1000, 0.05);
  CAR.tPrev = t;

  if(!CAR.drag && n){
    const cible = CAR.cible !== null ? CAR.cible
      : (n >= 3 ? Math.round(CAR.pos) : Math.max(0, Math.min(n - 1, Math.round(CAR.pos))));
    const k = 190, c = 20;              // ressort légèrement sous-amorti = petit rebond
    let reste = dt;
    while(reste > 0){
      const h = Math.min(1 / 240, reste);
      reste -= h;
      CAR.vel += (k * (cible - CAR.pos) - c * CAR.vel) * h;
      CAR.pos += CAR.vel * h;
    }
    if(Math.abs(cible - CAR.pos) < 0.0008 && Math.abs(CAR.vel) < 0.01){
      CAR.pos = n >= 3 ? carModulo(cible, n) : cible; // au repos : on ramène la position dans [0, n[
      CAR.vel = 0; CAR.cible = null;
      carAppliquer();
      return; // la boucle s'arrête
    }
  }
  carAppliquer();
  CAR.raf = requestAnimationFrame(carBoucle);
}

function carAllerA(index){
  const n = obtenirIdsPersonnes().length;
  if(!n) return;
  CAR.cible = n >= 3 ? index : Math.max(0, Math.min(n - 1, index));
  carDemarrer();
}

function initialiserCarousel(){
  if(CAR.prete) return;
  CAR.prete = true;
  const app = document.getElementById("app");

  app.addEventListener('pointerdown', (e) => {
    if(vueActuelle !== "login" || (e.pointerType === 'mouse' && e.button !== 0)) return;
    if(!e.target.closest || !e.target.closest('.carousel-famille') || CAR.pos === null) return;
    CAR.drag = true; CAR.moved = false; CAR.id = e.pointerId;
    CAR.startX = e.clientX; CAR.startPos = CAR.pos; CAR.prevPos = CAR.pos;
    CAR.lastT = performance.now(); CAR.vel = 0; CAR.cible = null;
    CAR.carteDown = e.target.closest('.famille-card');
    carDemarrer();
  });

  window.addEventListener('pointermove', (e) => {
    if(!CAR.drag || e.pointerId !== CAR.id) return;
    const m = carMesures();
    if(!m) return;
    const n = obtenirIdsPersonnes().length;
    const dx = e.clientX - CAR.startX;
    if(Math.abs(dx) > 6) CAR.moved = true;
    CAR.pos = carElastique(CAR.startPos - dx / m.s1, n);
    const maintenant = performance.now();
    const dt = Math.max((maintenant - CAR.lastT) / 1000, 0.008);
    CAR.vel = CAR.vel * 0.5 + ((CAR.pos - CAR.prevPos) / dt) * 0.5;
    CAR.prevPos = CAR.pos;
    CAR.lastT = maintenant;
    carDemarrer();
  });

  const relacher = (e) => {
    if(!CAR.drag || e.pointerId !== CAR.id) return;
    CAR.drag = false;
    const n = obtenirIdsPersonnes().length;
    const carte = CAR.carteDown;
    CAR.carteDown = null;

    if(!CAR.moved && e.type === 'pointerup' && carte){
      const ds = carEcart(Number(carte.dataset.index), CAR.pos, n);
      if(Math.abs(ds) < 0.5){
        CAR.vel = 0; CAR.cible = null;
        ouvrirEcranPin(carte.dataset.id);
        return;
      }
      CAR.vel = 0;
      carAllerA(Math.round(CAR.pos + ds)); // chemin le plus court vers la carte touchée
      return;
    }
    if(performance.now() - CAR.lastT > 90) CAR.vel = 0; // main arrêtée avant de relâcher
    const v = Math.max(-14, Math.min(14, CAR.vel));
    carAllerA(Math.round(CAR.pos + v * 0.22));
  };
  window.addEventListener('pointerup', relacher);
  window.addEventListener('pointercancel', relacher);

  app.addEventListener('wheel', (e) => {
    if(vueActuelle !== "login") return;
    const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    const maintenant = performance.now();
    if(Math.abs(delta) < 12 || maintenant - CAR.derniereRoue < 220) return;
    CAR.derniereRoue = maintenant;
    carAllerA(Math.round(CAR.pos) + (delta > 0 ? 1 : -1));
  }, { passive: true });

  document.addEventListener('keydown', (e) => {
    if(vueActuelle !== "login" || CAR.pos === null) return;
    const ids = obtenirIdsPersonnes();
    if(e.key === 'ArrowRight') carAllerA(Math.round(CAR.pos) + 1);
    else if(e.key === 'ArrowLeft') carAllerA(Math.round(CAR.pos) - 1);
    else if(e.key === 'Enter' && ids.length) ouvrirEcranPin(ids[carModulo(Math.round(CAR.pos), ids.length)]);
  });

  window.addEventListener('resize', carAppliquer);
}

/* ---- Horloge de l'écran de sélection : « 14 : 51 » / « Samedi 14 Novembre » ---- */
function texteHorlogeAccueil(d){
  const maj = (t) => t.charAt(0).toUpperCase() + t.slice(1);
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  const jour = d.toLocaleDateString('fr-FR', { weekday: 'long' });
  const mois = d.toLocaleDateString('fr-FR', { month: 'long' });
  return { heure: `${hh} : ${mm}`, date: `${maj(jour)} ${d.getDate()} ${maj(mois)}` };
}

function majHorlogeAccueil(){
  if(vueActuelle !== "login") return;
  const h = document.querySelector('.selection-header .heure');
  const dt = document.querySelector('.selection-header .date');
  if(!h || !dt) return;
  const t = texteHorlogeAccueil(new Date());
  if(h.textContent !== t.heure) h.textContent = t.heure;
  if(dt.textContent !== t.date) dt.textContent = t.date;
}

function htmlAvatarCarte(image){
  return image ? `<img src="${image}" alt="" draggable="false" onerror="this.remove()">` : '';
}

/* Met à jour les photos sans reconstruire l'écran (ne coupe pas un glissement en cours) */
function majAvatarsAccueil(){
  document.querySelectorAll('.famille-card').forEach(carte => {
    const image = obtenirMetaPersonne(carte.dataset.id).avatar;
    const zone = carte.querySelector('.carte-avatar');
    if(!zone) return;
    const actuelle = zone.querySelector('img');
    if(image && (!actuelle || actuelle.getAttribute('src') !== image)){
      zone.innerHTML = htmlAvatarCarte(image);
    }
  });
  majFondAccueil();
}

/* Applique à chaque calque la bannière de sa personne (local ou Firebase) */
function majFondAccueil(){
  document.querySelectorAll('.fond-calque').forEach(c => {
    const url = obtenirMetaPersonne(c.dataset.id).banner || '';
    const theme = THEMES[obtenirProfil(c.dataset.id).theme] || THEMES.bleu;
    const filtre = theme.sombre ? FILTRE_SOMBRE : '';   // voile sombre si la personne a choisi un thème sombre
    const cle = url + '|' + filtre;
    if(c.dataset.src === cle) return;
    c.dataset.src = cle;
    const image = `url("${url.replace(/"/g, '%22')}")`;
    c.style.backgroundImage = !url ? 'none' : (filtre ? `linear-gradient(${filtre}, ${filtre}), ${image}` : image);
  });
}

function rendre(){
  const app = document.getElementById("app");

  if(vueActuelle === "login"){
    const ids = obtenirIdsPersonnes();
    const existant = app.querySelector('.ecran-selection');
    if(existant && ids.length && existant.querySelectorAll('.famille-card').length === ids.length){
      majAvatarsAccueil();
      carAppliquer();
      return;
    }
    if(CAR.pos === null && ids.length){
      const martin = ids.indexOf("martin");
      CAR.pos = martin >= 0 ? martin : 0;
    }
    if(CAR.pos !== null){
      CAR.pos = ids.length >= 3 ? carModulo(CAR.pos, ids.length)
                                : Math.max(0, Math.min(CAR.pos, Math.max(0, ids.length - 1)));
    }
    app.innerHTML = vueLogin();
    CAR.fondActif = null; // nouveaux calques : premier affichage sans fondu
    majFondAccueil();
    carAppliquer();
  } else if(vueActuelle === "pin"){
    app.innerHTML = vuePin();
  } else if(vueActuelle === "taches"){
    app.innerHTML = vueTaches();
  }
  appliquerEntree(app);
  if(vueActuelle === "taches") programmerVerifSucces();
}

function vueTaches(){
  const p = PERSONNES[personneActive];
  const dateCle = formatDateCle(dateAffichee);
  const jour = nomJour(dateAffichee);
  const { jourNom, reste } = texteDateLisible(dateAffichee);

  let contenuPrincipal = "";

  if(p.type === "enfant"){
    const taches = (TACHES[personneActive] && TACHES[personneActive][jour]) || [];
    if(taches.length===0){
      contenuPrincipal = `<div class="vide">Aucune tâche pour ${jourNom}. 🎉</div>`;
    } else {
      const lignes = taches.map((texte, index)=>{
        const cle = cleCompletion(personneActive, dateCle, index);
        const info = etatCourant.completions[cle];
        const fait = !!(info && info.fait);
        const valide = !!(info && info.valide);
        let classeCase = "case";
        let contenuCase = "";
        if(valide){ classeCase += " valide"; contenuCase = "✓"; }
        else if(fait){ classeCase += " fait"; contenuCase = "✓"; }
        if(animCles.has(cle)) classeCase += " anim-pop";

        return `
          <div class="tache" ${fait ? '' : `onclick="toggleTache('${personneActive}', ${index})"`}>
            <div class="${classeCase}">${contenuCase}</div>
            <div class="texte-tache ${fait?'fait':''}">${texte}</div>
            ${fait && !valide ? '<div class="etiquette-attente">à valider</div>' : ''}
          </div>
        `;
      }).join("");
      contenuPrincipal = `<div class="liste-taches">${lignes}</div>`;
    }
  } else {
    // Vue parent : voir toutes les tâches de tous les enfants pour le jour affiché + validation
    contenuPrincipal = `<div class="section-titre">Tâches de la famille — ${jourNom}</div>`;
    const enfants = Object.entries(PERSONNES).filter(([id,pp])=>pp.type==="enfant");
    let blocs = "";
    enfants.forEach(([id, pp])=>{
      const taches = (TACHES[id] && TACHES[id][jour]) || [];
      if(taches.length===0) return;
      const lignes = taches.map((texte,index)=>{
        const cle = cleCompletion(id, dateCle, index);
        const info = etatCourant.completions[cle];
        const fait = !!(info && info.fait);
        const valide = !!(info && info.valide);
        let classeCase="case";
        let contenuCase="";
        if(valide){classeCase+=" valide"; contenuCase="✓";}
        else if(fait){classeCase+=" fait"; contenuCase="✓";}
        if(animCles.has(cle)) classeCase += " anim-pop";
        return `
          <div class="tache" style="cursor:default;">
            <div class="${classeCase}">${contenuCase}</div>
            <div class="texte-tache ${fait?'fait':''}">${texte}</div>
            ${fait && !valide ? `<button class="bouton-valider" onclick="validerTache('${cle}')">Valider</button>` : ''}
          </div>
        `;
      }).join("");
      blocs += `<div class="carte-membre"><div class="titre-membre">${pp.nom}</div>${lignes}</div>`;
    });
    contenuPrincipal += blocs || `<div class="vide">Aucune tâche prévue aujourd'hui.</div>`;
  }

  const themeCourant = obtenirProfil(personneActive).theme || "bleu";
  const pastillesTheme = Object.entries(THEMES).map(([id, t])=>
    `<div class="pastille-theme ${themeCourant===id?'actif':''}" style="--c:${t.swatch};" onclick="choisirThemeMenu('${id}')" title="${t.label}"></div>`
  ).join("");

  const classeJour = animJour ? ` glisse-${animJour}` : "";
  const classeDate = animJour ? ` change-${animJour}` : "";
  const cptSucces = comptageSucces(personneActive);
  animCles.clear();
  animJour = null;

  return `
    <div class="ecran-taches">
      <div class="barre-haut">
        <div class="entete-personne">
          ${rendreAvatarEditable(personneActive)}
          <div class="bienvenue">Bonjour, ${p.nom}</div>
        </div>
        <div class="deconnexion" onclick="retourLogin()">Se déconnecter</div>
      </div>

      <div class="selecteur-jour">
        <div class="fleche" onclick="changerJour(-1)">‹</div>
        <div class="date-texte${classeDate}">
          <div class="jour-nom">${jourNom}</div>
          <div class="jour-num">${reste}</div>
        </div>
        <div class="fleche" onclick="changerJour(1)">›</div>
      </div>
      <div class="rangee-boutons">
        <button class="bouton-aujourdhui" onclick="allerAujourdhui()">Revenir à aujourd'hui</button>
        <button class="bouton-succes" onclick="ouvrirSucces()">${ICONES.trophee}<span>Succès</span><span class="compteur">${cptSucces.debloques}/${cptSucces.total}</span></button>
      </div>

      <div class="contenu-jour${classeJour}">${contenuPrincipal}</div>
      <div class="conteneur-edition-profil">
        <div class="options-edition-profil" ${editionProfilOuverte ? '' : 'style="display:none;"'}>
          <div class="selecteur-theme">${pastillesTheme}</div>
          ${p.type === "parent" ? `<button class="bouton-option-edition" onclick="ouvrirParametresNotifications()" title="Notifications">${ICONES.cloche}</button>` : ''}
        </div>
        <button class="bouton-edition-profil ${editionProfilOuverte ? 'ouvert' : ''}" onclick="basculerEditionProfil()" title="${editionProfilOuverte ? 'Fermer les options' : 'Modifier le profil'}">${editionProfilOuverte ? ICONES.fermer : ICONES.crayon}</button>
      </div>

  `;
}

/* Les succès ne comptent que les tâches à partir de cette date (format AAAA-MM-JJ) */
const SUCCES_DEPUIS = "2026-11-15";
/* Ces succès ne dépendent pas des tâches : on ne les remet pas à zéro */
const SUCCES_HORS_TACHES = ["coloriste", "noctambule", "photogenique"];

/* Succès réellement débloqués : on ignore ceux gagnés avant la date de départ */
function succesDebloques(personneId){
  const brut = obtenirProfil(personneId).succes || {};
  const res = {};
  Object.entries(brut).forEach(([id, iso]) => {
    if(SUCCES_HORS_TACHES.includes(id) || formatDateCle(new Date(iso)) >= SUCCES_DEPUIS) res[id] = iso;
  });
  return res;
}

function succesPour(personneId){
  const type = PERSONNES[personneId] ? PERSONNES[personneId].type : "enfant";
  return SUCCES.filter(s => s.pour === "tous" || s.pour === type);
}

/* Journées parfaites et séries : un jour sans tâche prévue ne casse pas la série */
function calculerSeries(personneId, parJour){
  const jours = Object.keys(parJour).sort();
  if(!jours.length) return { parfaites:0, serieMax:0 };
  const fin = new Date(); fin.setHours(12, 0, 0, 0);
  const aujourdhui = formatDateCle(new Date());
  let parfaites = 0, serie = 0, serieMax = 0;
  for(let d = new Date(jours[0] + "T12:00:00"); d <= fin; d.setDate(d.getDate() + 1)){
    const cle = formatDateCle(d);
    const prevu = ((TACHES[personneId] || {})[JOURS_SEMAINE[d.getDay()]] || []).length;
    if(!prevu) continue;
    if((parJour[cle] || 0) >= prevu){
      parfaites++; serie++; serieMax = Math.max(serieMax, serie);
    } else if(cle !== aujourdhui){
      serie = 0; // journée manquée (aujourd'hui n'est pas encore perdu)
    }
  }
  return { parfaites, serieMax };
}

function statsPersonne(personneId){
  const profil = obtenirProfil(personneId);
  const completions = etatCourant.completions || {};
  let faites = 0, validees = 0, valideesParMoi = 0, leveTot = 0;
  const parJour = {};
  Object.entries(completions).forEach(([cle, info])=>{
    if(!info) return;
    const [dateCle, pid] = cle.split("_");
    if(dateCle < SUCCES_DEPUIS) return; // jours avant aujourd'hui ignorés
    if(pid === personneId){
      if(info.fait){
        faites++;
        parJour[dateCle] = (parJour[dateCle] || 0) + 1;
        const h = info.horodatage ? new Date(info.horodatage).getHours() : 12;
        if(h < 8) leveTot++;
      }
      if(info.valide) validees++;
    }
    if(info.validePar === personneId) valideesParMoi++;
  });
  const { parfaites, serieMax } = calculerSeries(personneId, parJour);
  return {
    faites, validees, valideesParMoi, leveTot, parfaites, serieMax,
    aTheme: profil.theme ? 1 : 0,
    themeNuit: profil.theme === "nuit" ? 1 : 0,
    aPhoto: obtenirPhotoProfil(personneId) ? 1 : 0
  };
}

function comptageSucces(personneId){
  const liste = succesPour(personneId);
  const deja = succesDebloques(personneId);
  return { debloques: liste.filter(s => deja[s.id]).length, total: liste.length };
}

/* ---- Détection des nouveaux succès (appelée après chaque rendu de la page des tâches) ---- */
let timerSucces = null;
function programmerVerifSucces(delai){
  clearTimeout(timerSucces);
  timerSucces = setTimeout(verifierSucces, delai || 1000);
}

async function verifierSucces(){
  if(vueActuelle !== "taches" || !personneActive) return;
  const id = personneActive;
  const deja = succesDebloques(id);
  const stats = statsPersonne(id);
  const nouveaux = succesPour(id).filter(s => !deja[s.id] && s.valeur(stats) >= s.objectif);
  if(!nouveaux.length) return;

  const maintenant = new Date().toISOString();
  const succes = { ...deja };
  nouveaux.forEach(s => { succes[s.id] = maintenant; });
  const nouvelEtat = { ...etatCourant, profils: { ...etatCourant.profils } };
  nouvelEtat.profils[id] = { ...obtenirProfil(id), succes };
  etatCourant = nouvelEtat;

  afficherSucces(nouveaux);
  const compteur = document.querySelector('.bouton-succes .compteur');
  if(compteur){ const c = comptageSucces(id); compteur.textContent = `${c.debloques}/${c.total}`; }
  try{
    await DOC_REF.set(nouvelEtat);
  }catch(e){
    console.error("Erreur de sauvegarde des succès:", e);
  }
}

/* ---- Toasts ---- */
const fileToasts = [];
let toastEnCours = false;

function afficherSucces(liste){
  if(liste.length > 3){
    fileToasts.push({ groupe: liste.length });
  } else {
    liste.forEach(s => fileToasts.push(s));
  }
  toastSuivant();
}

function toastSuivant(){
  if(toastEnCours) return;
  const s = fileToasts.shift();
  if(!s) return;
  toastEnCours = true;
  const el = document.createElement('div');
  el.className = 'toast-succes';
  el.innerHTML = s.groupe ? `
      <div class="toast-icone">${svgSucces("trophee")}</div>
      <div class="toast-texte"><small>Succès débloqués</small><strong>${s.groupe} nouveaux succès !</strong><span>Touche pour les découvrir</span></div>`
    : `
      <div class="toast-icone">${svgSucces(s.icone)}</div>
      <div class="toast-texte"><small>Succès débloqué</small><strong>${s.titre}</strong><span>${s.desc}</span></div>`;
  el.onclick = () => { fermerToast(el); ouvrirSucces(); };
  document.getElementById("toasts-succes").appendChild(el);
  confettis();
  el._minuteur = setTimeout(() => fermerToast(el), 4600);
}

function fermerToast(el){
  if(!el.parentNode || el.classList.contains('sortie')) return;
  clearTimeout(el._minuteur);
  el.classList.add('sortie');
  setTimeout(() => { el.remove(); toastEnCours = false; toastSuivant(); }, 430);
}

function confettis(){
  if(mouvementReduit()) return;
  const conteneur = document.createElement('div');
  conteneur.className = 'confettis';
  const couleurs = [getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#6C8CFF', '#FFD36B', '#FF8FA3', '#7BE0B0', '#8FB8FF', '#FFFFFF'];
  for(let i = 0; i < 30; i++){
    const p = document.createElement('i');
    p.style.background = couleurs[i % couleurs.length];
    conteneur.appendChild(p);
    const dx = (Math.random() - 0.5) * 340;
    const haut = 40 + Math.random() * 110;
    const chute = 180 + Math.random() * 260;
    const rot = (Math.random() - 0.5) * 900;
    p.animate([
      { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
      { transform: `translate(${dx * 0.55}px,${-haut}px) rotate(${rot * 0.4}deg)`, opacity: 1, offset: 0.35 },
      { transform: `translate(${dx}px,${chute}px) rotate(${rot}deg)`, opacity: 0 }
    ], { duration: 1100 + Math.random() * 700, easing: 'cubic-bezier(.2,.7,.4,1)', fill: 'forwards' });
  }
  document.body.appendChild(conteneur);
  setTimeout(() => conteneur.remove(), 2100);
}

/* ---- Panneau « Succès » ---- */
function ouvrirSucces(){
  const id = personneActive;
  if(!id) return;
  const stats = statsPersonne(id);
  const deja = succesDebloques(id);
  const liste = succesPour(id).map(s => {
    const val = Math.min(s.valeur(stats), s.objectif);
    return { ...s, val, date: deja[s.id] || null, ok: !!deja[s.id] || val >= s.objectif };
  });
  liste.sort((a, b) => (b.ok - a.ok) || ((b.val / b.objectif) - (a.val / a.objectif)));
  const nbOk = liste.filter(s => s.ok).length;

  const lignes = liste.map((s, k) => {
    const date = s.date ? new Date(s.date).toLocaleDateString('fr-FR', { day:'numeric', month:'long' }) : "";
    const bas = s.ok
      ? `<div class="date">Débloqué${date ? " le " + date : ""}</div>`
      : (s.objectif > 1
          ? `<div class="barre-prog"><div class="rail"><i style="width:${Math.round(100 * s.val / s.objectif)}%"></i></div><span>${s.val} / ${s.objectif}</span></div>`
          : '');
    return `
      <div class="ligne-succes ${s.ok ? '' : 'verrouille'}" style="--k:${k}">
        <div class="icone-succes">${svgSucces(s.icone)}</div>
        <div class="texte">
          <div class="titre">${s.titre}</div>
          <div class="desc">${s.desc}</div>
          ${bas}
        </div>
      </div>`;
  }).join("");

  document.getElementById("boite-succes").innerHTML = `
    <div class="entete-succes">
      <div class="icone-succes" style="width:42px;height:42px;">${svgSucces("trophee")}</div>
      <div><h3>Succès</h3><div class="total">${nbOk} sur ${liste.length} débloqués</div></div>
      <button type="button" class="bouton-fermer" onclick="fermerSucces()" aria-label="Fermer">${ICONES.fermer}</button>
    </div>
    <div class="barre-globale"><i style="width:${Math.round(100 * nbOk / liste.length)}%"></i></div>
    <div class="liste-succes">${lignes}</div>`;
  document.getElementById("fond-succes").style.display = "flex";
}

function fermerSucces(){
  const fond = document.getElementById("fond-succes");
  if(fond) fond.style.display = "none";
}

document.addEventListener('keydown', (e) => { if(e.key === 'Escape') fermerSucces(); });

/* ---- Éclat « liquide » des boutons en verre : suit le doigt / la souris ---- */
const SEL_VERRE = '.famille-card,.deconnexion,.fleche,.bouton-aujourdhui,.bouton-succes,.touche,.retour,.btn-annuler,.btn-confirmer,.option-notif,.bouton-option-edition,.bouton-edition-profil,.bouton-valider,.bouton-fermer,.badge-camera';
function suivreReflet(e){
  const cible = e.target && e.target.closest ? e.target.closest(SEL_VERRE) : null;
  if(!cible) return;
  const r = cible.getBoundingClientRect();
  cible.style.setProperty('--mx', (e.clientX - r.left) + 'px');
  cible.style.setProperty('--my', (e.clientY - r.top) + 'px');
}
document.addEventListener('pointerdown', suivreReflet, { passive:true });
document.addEventListener('pointermove', suivreReflet, { passive:true });

['pointerdown', 'pointermove', 'keydown', 'wheel', 'input', 'change'].forEach(type => {
  document.addEventListener(type, enregistrerActivite, { passive:true });
});
document.addEventListener('scroll', enregistrerActivite, { passive:true, capture:true });
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden) verifierInactivite();
});

async function demarrer(){
  appliquerTheme("bleu");
  document.getElementById("app").innerHTML = `
    <div class="vide" style="padding-top:120px;">Chargement du carnet…</div>
  `;
  await chargerConfigPersonnes();
  initialiserCarousel();
  rendre();
  chargerImagesPersonnes(); // icon.png / banniere.png : s'affichent dès qu'elles sont chargées
  verifierDigestQuotidien();
  setInterval(verifierDigestQuotidien, 60 * 1000);
  setInterval(majHorlogeAccueil, 1000); // revérifie toutes les 5 minutes
}

demarrer();
</script>
<script type="module">
/* Liquid glass : librairie @ybouane/liquidglass (WebGL).
   Les éléments de verre doivent être des enfants directs de la racine #verre : on y place donc un
   « proxy » vide par bouton/carte, calé chaque image sur la position du vrai élément (qui reste cliquable). */
import { LiquidGlass } from 'https://cdn.jsdelivr.net/npm/@ybouane/liquidglass/dist/index.js';

const SEL = '.famille-card,.deconnexion,.fleche,.bouton-aujourdhui,.bouton-succes,.touche,.retour,.bouton-option-edition,.bouton-edition-profil,.bouton-valider,.badge-camera,.pastille-theme,.selecteur-theme';
const TAILLE_POOL = 40;
const FOND_DEFAUT = 'https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1800&q=80';
const racine = document.getElementById('verre');
const imgs = Array.from(racine.querySelectorAll('img.bg'));
const filtre = racine.querySelector('.filtre');
const pool = [];
let inst = null, actif = 0, urlCourante = '', couleurFiltre = '';
let requeteFond = 0, minuterieFondu = null;

function chargerImg(img, url){
  return new Promise(ok => { img.crossOrigin = 'anonymous'; img.onload = () => ok(true); img.onerror = () => ok(false); img.src = url; });
}

/* fond : fondu entre la bannière précédente et la nouvelle (durée : FOND_FONDU_MS) */
function changerFond(url){
  url = url || FOND_DEFAUT;
  if(url === urlCourante) return;
  urlCourante = url;
  const numeroRequete = ++requeteFond;
  const nouveau = imgs[1 - actif], ancien = imgs[actif];
  chargerImg(nouveau, url).then(ok => {
    if(!ok || numeroRequete !== requeteFond || url !== urlCourante) return;
    clearTimeout(minuterieFondu);
    nouveau.style.zIndex = 2; ancien.style.zIndex = 1;
    nouveau.dataset.dynamic = ''; ancien.dataset.dynamic = '';
    nouveau.style.opacity = 1;
    actif = 1 - actif;
    minuterieFondu = setTimeout(() => {
      ancien.style.opacity = 0;
      delete nouveau.dataset.dynamic; delete ancien.dataset.dynamic;
      if(inst) inst.markChanged();
      minuterieFondu = null;
    }, FOND_FONDU_MS + 100);
  });
}

function opaciteEff(el){
  let o = 1;
  for(let n = el; n && n !== document.body; n = n.parentElement) o *= parseFloat(getComputedStyle(n).opacity);
  return o;
}

function placer(p, r, el, cs, o){
  const base = Math.min(r.width, r.height) / 2;
  let rad = cs.borderTopLeftRadius;
  rad = rad.includes('%') ? base * parseFloat(rad) / 50 : parseFloat(rad) * (r.width / (el.offsetWidth || r.width));
  rad = Math.max(2, Math.min(rad || 0, base));
  const bulle = el.matches('.pastille-theme,.badge-camera');
  const cfg = JSON.stringify({
    blurAmount: 0.2, cornerRadius: +rad.toFixed(1), zRadius: +Math.max(3, Math.min(rad, bulle ? rad : 30)).toFixed(1),
    opacity: +o.toFixed(2), shadowOpacity: 0.22, shadowSpread: 8, bevelMode: bulle ? 1 : 0
  });
  if(p.dataset.config !== cfg) p.dataset.config = cfg;
  const v = [r.left, r.top, r.width, r.height].map(n => n.toFixed(1)).join();
  if(p._v !== v){
    p._v = v;
    p.style.left = r.left + 'px'; p.style.top = r.top + 'px';
    p.style.width = r.width + 'px'; p.style.height = r.height + 'px';
  }
  p.style.zIndex = 10 + (parseInt(cs.zIndex) || 0);
}

function cacher(p){
  if(p._v === 'x') return;
  p._v = 'x';
  p.style.left = '-40px'; p.style.top = '-40px'; p.style.width = '4px'; p.style.height = '4px';
}

function boucle(){
  requestAnimationFrame(boucle);

  /* 1) fond = bannière de la personne (au centre du carrousel, ou connectée / en train de saisir son code) */
  const login = vueActuelle === 'login';
  let id = null;
  if(login){
    const ids = obtenirIdsPersonnes();
    if(CAR.pos !== null && ids.length) id = ids[carModulo(Math.round(CAR.pos), ids.length)];
  } else {
    id = personneActive;
  }
  if(id){
    changerFond(obtenirMetaPersonne(id).banner);
    racine.style.setProperty('--voile', login ? '0' : '.28');
    if(login){
      const t = THEMES[obtenirProfil(id).theme] || THEMES.bleu;
      racine.style.setProperty('--filtre-fond', t.sombre ? FILTRE_SOMBRE : FILTRE_AUCUN);
    } else {
      racine.style.removeProperty('--filtre-fond');
    }
  }
  if(!inst) return;
  const cf = getComputedStyle(filtre); const c = cf.backgroundColor + cf.backgroundImage;
  if(c !== couleurFiltre){ couleurFiltre = c; inst.markChanged(filtre); }

  /* 2) un proxy de verre par élément visible */
  let k = 0;
  for(const el of document.querySelectorAll(SEL)){
    if(k >= pool.length) break;
    const cs = getComputedStyle(el);
    if(cs.visibility === 'hidden' || cs.display === 'none') continue;
    const r = el.getBoundingClientRect();
    if(r.width < 2 || r.height < 2 || r.bottom < 0 || r.top > innerHeight) continue;
    const o = opaciteEff(el);
    if(o < 0.01) continue;
    placer(pool[k++], r, el, cs, o);
  }
  for(; k < pool.length; k++) cacher(pool[k]);
}

(async () => {
  await Promise.all(imgs.map(i => chargerImg(i, FOND_DEFAUT)));
  urlCourante = FOND_DEFAUT;
  for(let i = 0; i < TAILLE_POOL; i++){
    const d = document.createElement('div');
    d.className = 'verre-proxy';
    d.style.cssText = 'left:-40px;top:-40px;width:4px;height:4px';
    racine.appendChild(d);
    pool.push(d);
  }
  requestAnimationFrame(boucle); // le fond fonctionne même si la librairie ne se charge pas
  inst = await LiquidGlass.init({ root: racine, glassElements: pool });
})().catch(e => console.error('LiquidGlass :', e));
</script>
